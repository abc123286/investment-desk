name: Update data

# GitHub's own schedule does not start this workflow reliably for this repository, so an outside timer
# (cron-job.org) starts it every 15 minutes through the "workflow_dispatch" API with market=AUTO.
# The schedule below is kept as a backup in case GitHub starts honouring it.
on:
  schedule:
    - cron: "*/15 1-9 * * 1-5"    # 9:00am–5:45pm MYT — Bursa prices (times are UTC)
    - cron: "*/15 13-21 * * 1-5"  # 9:00pm–5:45am MYT — US prices
  workflow_dispatch:
    inputs:
      market:
        description: "Which market to refresh"
        type: choice
        options: [AUTO, ALL, US, MY]
        default: AUTO

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Fetch prices
        id: fetch
        env:
          DESK_MARKET: ${{ github.event.inputs.market || 'AUTO' }}
        run: |
          case "$DESK_MARKET" in AUTO|ALL|US|MY) ;; *) echo "Bad market value"; exit 2;; esac
          git pull -q --ff-only origin main || true   # start from the newest saved data (runs queue one after another)
          python scripts/update.py
      - name: Lock signals
        if: success()
        run: node scripts/signals.mjs
      - name: Commit new data
        # also runs when the fetch failed, so the page can show the failed attempt; the job still ends as failed
        if: always() && hashFiles('docs/data/desk.json') != ''
        run: |
          git config user.name "investment-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/desk.json docs/data/signals.json 2>/dev/null || git add docs/data/desk.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          # if another run saved in between, keep this run's freshly built data files
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
